<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Contacto - FundAR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<figure class="foto">
    <img
    src="https://drive.google.com/thumbnail?id=1ZAodhLn4V9veu0PlKV7Cg43u1rZYn82X&sz=w1000"
    alt="Logo FundAR"
    width="250"></figure>

    <h1>FundAR</h1>

           <nav>
    <ul>
        <li><a href="./Index.html">Inicio</a></li>

        <li>
            <a href="./quienes-somos.html">
                Quiénes Somos
            </a>
        </li>

        <li>
            <a href="./contacto.html">
                Contacto
            </a>
        </li>
    </ul>
</nav>


</header>

<main>

<section>

    <h2>Comunicate con nosotros</h2>

    <p>
        Podés enviarnos consultas sobre torneos,
        eventos o participación en la comunidad.
    </p>

    <form action="#" method="post">

        <label for="nombre">
            Nombre:
        </label>

        <br>

        <input type="text"
               id="nombre"
               name="nombre"
               required>

        <br><br>

        <label for="email">
            Correo electrónico:
        </label>

        <br>

        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>

        <label for="mensaje">
            Mensaje:
        </label>

        <br>

        <textarea id="mensaje"
                  name="mensaje"
                  rows="5"
                  cols="30"></textarea>

        <br><br>

        <button type="submit">
            Enviar
        </button>

    </form>

</section>

</main>

</body>
<footer>

        <p>
            <small>
                &copy; 2026 FundAR - Fundación Argentina de E-Sports
            </small>
        </p>

    </footer>
</html>
