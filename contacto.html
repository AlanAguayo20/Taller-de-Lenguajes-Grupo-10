<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Nexus Play</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./CSS/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

</head>

<body>


<header>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">

        <a href="./index.html" class="logo d-flex align-items-center gap-2 text-decoration-none">
            <img src="imagenes/icono.png" alt="Logo">
            <h2 class="m-0">Nexus<span class="logo-acento">Play</span></h2>
        </a>

        <ul class="navbar-nav ms-auto gap-3 d-flex flex-row">
            <li class="nav-item"><a class="nav-link" href="./index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="./programas.html">Eventos</a></li>
            <li class="nav-item"><a class="nav-link" href="./contacto.html">Inscripción</a></li>
            <li class="nav-item"><a class="nav-link" href="./quienes-somos.html">Quiénes Somos</a></li>
            <li class="nav-item">
                <button class="theme-toggle" id="btn-modo">☀️</button>
            </li>
        </ul>

    </div>
</nav>
</header>


<main>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h1>Inscribite a nuestros torneos</h1>
        <p>Completá el formulario y formá parte de la comunidad Nexus Play.</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-6">

            <form class="formulario p-4 shadow">

                <input type="text" class="form-control mb-3" placeholder="Nombre completo" required>

                <input type="email" class="form-control mb-3" placeholder="Correo electrónico" required>

                <select class="form-select mb-3" required>
                    <option value="">Selecciona un juego</option>
                    <option>League of Legends</option>
                    <option>Counter Strike 2</option>
                    <option>Valorant</option>
                    <option>Fortnite</option>
                    <option>Rocket League</option>
                    <option>Minecraft</option>
                </select>

                <textarea class="form-control mb-3" placeholder="Mensaje"></textarea>

                <button class="btn btn-success w-100">
                    Inscribirme
                </button>

            </form>

        </div>

    </div>

    <!-- OTROS MEDIOS DE CONTACTO -->
    <div class="row g-4 mt-5 pb-5 text-center">

        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h3>Correo</h3>
                    <p>contacto@nexusplay.org</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h3>Discord</h3>
                    <p>discord.gg/nexusplay</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h3>Instagram</h3>
                    <p>@nexusplay.ong</p>
                </div>
            </div>
        </div>

    </div>

</div>
</main>



<footer>

    <p>
        © 2026 Nexus Play - Comunidad Gamer
    </p>

</footer>
    <script src="./js/main.js"></script>

</body>

</html>
