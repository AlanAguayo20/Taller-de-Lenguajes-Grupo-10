<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contacto - Nexus Play</title>

    <link rel="stylesheet" href="./CSS/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

</head>

<body>


<header>

    <nav>

        <div class="logo">

            <img src="imagenes/icono.png" alt="Logo">

            <h2>Nexus Play</h2>

        </div>

        <ul>

            <li><a href="./index.html">Inicio</a></li>

            <li><a href="./quienes-somos.html">Quiénes Somos</a></li>

            <li><a href="./programas.html">Programas</a></li>

            <li><a href="./contacto.html">Contacto</a></li>

        </ul>

    </nav>

</header>


<main>

<section class="seccion">

    <h1>Inscripción a Torneos</h1>

    <p class="texto">

        Registrate para participar en nuestros
        torneos y eventos de la comunidad gamer.

    </p>

    <div class="formulario">

        <form>

            <input
                type="text"
                placeholder="Nombre completo"
                required
            >


            <input
                type="email"
                placeholder="Correo electrónico"
                required
            >


            <select required>

                <option value="">
                    Selecciona un juego
                </option>

                <option>
                    League of Legends
                </option>

                <option>
                    Counter Strike 2
                </option>

                <option>
                    Valorant
                </option>

                <option>
                    Fortnite
                </option>

                <option>
                    Rocket League
                </option>

                <option>
                    Minecraft
                </option>

            </select>



            <textarea
                placeholder="Mensaje"
            ></textarea>



            <button class="boton">

                Inscribirme

            </button>

        </form>

    </div>

</section>

</main>



<footer>

    <p>
        © 2026 Nexus Play - Comunidad Gamer
    </p>

</footer>

</body>

</html>
